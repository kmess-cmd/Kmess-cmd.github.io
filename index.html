<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>kylemesser.com</title>
<style>
  :root {
    --bg: #0a0e12;
    --bg-glow: #0d1620;
    --cyan: #4dd8e6;
    --cyan-dim: #2a6b73;
    --grey: #6b7684;
    --line: #1a232b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 35%, var(--bg-glow), var(--bg) 65%);
    color: var(--grey);
    font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .prompt {
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--cyan-dim);
    margin: 0 0 18px;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(77, 216, 230, 0.45), 0 0 40px rgba(77, 216, 230, 0.15);
  }

  h1 span {
    color: #d7e6ea;
    text-shadow: none;
  }

  .cursor {
    display: inline-block;
    width: 0.5ch;
    background: var(--cyan);
    margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .rule {
    height: 1px;
    background: var(--line);
    margin: 28px auto;
    width: 64px;
  }

  .status {
    font-size: 14px;
    line-height: 1.7;
    color: var(--grey);
    margin: 0 0 6px;
  }

  .status strong {
    color: #b8c4cc;
    font-weight: 500;
  }

  .meta {
    margin-top: 28px;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--cyan-dim);
  }

  .meta a {
    color: var(--cyan-dim);
    text-decoration: none;
    border-bottom: 1px solid var(--cyan-dim);
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .meta a:hover {
    color: var(--cyan);
    border-color: var(--cyan);
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="prompt">// site status</p>
    <h1>kylemesser<span>.com</span><span class="cursor">&nbsp;</span></h1>
    <div class="rule"></div>
    <p class="status"><strong>Offline for now.</strong></p>
    <p class="status">Settling into my current role. Always looking forward to my next adventure.</p>
    <p class="meta">In the meantime, reach me at <a href="mailto:kylemesser@me.com">kylemesser@me.com</a></p>
  </div>
</body>
</html>
